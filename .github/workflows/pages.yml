name: Deploy GitHub Pages

# Publishes the static site in `docs/` to GitHub Pages.
#
# Uses the Actions publishing source rather than the legacy `main:/docs` branch
# source, so the artifact is built and uploaded explicitly and the deployment is
# visible in the Actions tab. `docs/.nojekyll` is shipped with the artifact so
# Jekyll never runs over it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the job, plus the two scopes Pages deployment needs:
# `pages: write` to create the deployment, `id-token: write` for the OIDC token
# the deploy step exchanges.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let an in-flight run finish
# rather than cancelling it mid-deploy (a cancelled deploy can leave the site
# reporting a failed deployment).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
